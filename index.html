<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Privacy: keep this site out of search engines -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <meta name="googlebot" content="noindex, nofollow" />
  <title>JLE · Opportunity Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">JLE</span>
      <span class="brand-sub">Opportunity Dashboard</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="jobs">Opportunities</button>
      <button class="tab" data-view="bio">Biography</button>
    </nav>
    <div class="topbar-right">
      <span class="updated" id="updatedStamp"></span>
    </div>
  </header>

  <main>
    <!-- ============================ JOBS VIEW ========================= -->
    <section id="view-jobs" class="view active">
      <div class="toolbar">
        <div class="search-wrap">
          <input type="search" id="searchBox" placeholder="Search title, company, tags, fit notes…" autocomplete="off" />
        </div>
        <div class="quick-filters" id="quickFilters">
          <button class="chip toggle" data-toggle="new">🟢 New</button>
          <button class="chip toggle" data-toggle="starred">★ Starred</button>
          <button class="chip toggle" data-toggle="flagged">⚑ Flagged</button>
        </div>
        <div class="sort-wrap">
          <label for="sortBy">Sort</label>
          <select id="sortBy">
            <option value="new">Newest added</option>
            <option value="salary">Salary (high→low)</option>
            <option value="company">Company A→Z</option>
            <option value="title">Title A→Z</option>
          </select>
        </div>
      </div>

      <div class="filters-bar">
        <div class="filter-group" id="filter-roleFamily">
          <div class="filter-label">Role family</div>
          <div class="filter-chips"></div>
        </div>
        <div class="filter-group" id="filter-regions">
          <div class="filter-label">Location</div>
          <div class="filter-chips"></div>
        </div>
        <div class="filter-group" id="filter-workMode">
          <div class="filter-label">Work mode</div>
          <div class="filter-chips"></div>
        </div>
        <div class="filter-group" id="filter-kind">
          <div class="filter-label">Card type</div>
          <div class="filter-chips"></div>
        </div>
      </div>

      <div class="results-meta">
        <span id="resultCount"></span>
        <div class="results-actions">
          <button class="linkbtn" id="markSeenBtn">Mark all as seen</button>
          <button class="linkbtn" id="clearFiltersBtn">Clear filters</button>
        </div>
      </div>

      <div id="cards" class="cards-grid"></div>
      <div id="emptyState" class="empty-state" hidden>
        <p>No opportunities match your filters.</p>
        <button class="linkbtn" onclick="document.getElementById('clearFiltersBtn').click()">Clear filters</button>
      </div>
    </section>

    <!-- ============================ BIO VIEW ========================= -->
    <section id="view-bio" class="view">
      <div id="bioContent" class="bio"></div>
    </section>
  </main>

  <footer class="sitefoot">
    <span>Private dashboard · hidden from search engines</span>
    <span id="footStamp"></span>
  </footer>

  <script src="assets/data/jobs.js"></script>
  <script src="assets/data/bio.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
